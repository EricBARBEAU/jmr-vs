<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      const redirectTo = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem("redirectPath", redirectTo);
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
